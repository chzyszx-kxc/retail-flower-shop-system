location = /retail-flower {
    return 301 /retail-flower/;
}

location /retail-flower/ {
    alias /var/www/retail-flower/;
    index index.html;
    try_files $uri $uri/ /retail-flower/index.html;
}

location = /retail-flower-admin {
    return 301 /retail-flower-admin/;
}

location /retail-flower-admin/ {
    alias /var/www/retail-flower-admin/;
    index index.html;
    try_files $uri $uri/ /retail-flower-admin/index.html;
}

location /retail-flower-api/ {
    proxy_pass http://127.0.0.1:8010/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /static/ {
    alias /var/www/retail-flower/static/;
}
